name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/todo-app/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Frontend/todo-app/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/todo-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/todo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # CI=true makes react-scripts run tests once (non-watch) and fail the build on any test failures or lint warnings.
        env:
          CI: true
        run: npm test -- --passWithNoTests

      - name: Build production bundle
        env:
          CI: true
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-build
          path: Frontend/todo-app/build
          retention-days: 2
